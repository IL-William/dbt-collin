name: release

# A version in Cargo.toml with no tag yet is released from main: collin is built
# for each target (macOS on Apple silicon, Linux and Windows on x86_64), every
# archive's provenance is attested, and the tag and the release are created
# together at the commit that was built (0035). The notes list the pull
# requests merged since the previous release.
#
# Before the tag exists, the Windows archive is sent to VirusTotal, and a flag
# from any engine stops the release (0052). A release cannot be changed once it
# is out, so the check has to be on the file the release job uploads and before
# it runs. The Linux and macOS archives are not sent: the Windows .zip is what
# runs on the Windows machines where that engine sits, and dbt-edith's binary
# is the one it flagged there. A run by hand with the box ticked
# publishes anyway. After an outage or an analysis that was slow, "Re-run
# failed jobs" scans the same artifact again and uploads nothing VirusTotal
# already has. The result goes into the release's notes, and a small
# virustotal.json asset carries it to the badge in the README (0053).
#
# The tag is made here rather than pushed by hand: a tag pushed with this
# workflow's token would start no workflow, and one pushed by hand is a step
# that gets forgotten.
#
# A pull request that touches this file or Cargo.toml runs the same builds
# without publishing: tags here cannot be moved or deleted, so a broken release,
# a Windows-only one included, has to be found before the bump merges and its
# tag exists.
on:
  push:
    branches: [main]
    # A release needs a new version, and this file in case the last attempt
    # failed for a reason fixed here.
    paths: [Cargo.toml, .github/workflows/release.yml]
  pull_request:
    paths: [Cargo.toml, ".github/workflows/release.yml"]
  # A release that failed on something outside this repository, retried on
  # main as it is, or one a VirusTotal flag blocked and that is published anyway.
  workflow_dispatch:
    inputs:
      publish_even_if_flagged:
        description: Publish even if a VirusTotal engine flags the file
        type: boolean
        default: false

permissions:
  contents: read

# Two pushes to main in a row must not both find the same version untagged.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version Cargo.toml names, and whether main still owes it a release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      due: ${{ steps.read.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "collin-cli") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            due=false
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            due=false
          else
            due=true
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "v$version, release due: $due"

  build:
    needs: version
    # Nothing to build on main when the version already has its release.
    if: github.event_name == 'pull_request' || needs.version.outputs.due == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # psm, under sqlparser, compiles C, and a Windows machine with no
          # build tools cannot `cargo install` collin: this runner has MSVC.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        # Windows defaults to pwsh, where "$TARGET" is not the variable.
        shell: bash
    steps:
      # The Windows leg tests and packages the same LF files as the other
      # targets, README and LICENSE in the archive included. It runs before the
      # checkout so the repository and its submodule both come out that way.
      # Reading a CRLF project is covered by unit tests.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The lineage written by hand the tests compare with (0042).
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # psm, under sqlparser, compiles C, and a static Linux binary needs musl's
      # compiler for it.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # No shared cache here: nothing a branch wrote into the CI cache can reach a
      # published binary.
      - run: cargo test --locked --release --target "$TARGET"
      - run: cargo build --locked --release --target "$TARGET" -p collin-cli
      - name: Package
        env:
          DUE: ${{ needs.version.outputs.due }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$DUE" = true ]; then version=v$VERSION; else version=check; fi
          dir="collin-$version-$TARGET"
          mkdir "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/collin.exe" LICENSE README.md "$dir/"
            # Compress-Archive is on the image, so the zip needs no extra tool.
            # pwsh rather than Windows PowerShell 5.1, whose zips use
            # backslashes in entry names. It reads dir from the environment.
            export dir
            pwsh -NoProfile -Command 'Compress-Archive -Path $env:dir -DestinationPath ($env:dir + ".zip")'
          else
            cp "target/$TARGET/release/collin" LICENSE README.md "$dir/"
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            collin-*.tar.gz
            collin-*.zip
          if-no-files-found: error
          retention-days: 7

  # The Windows archive as the release job will upload it, sent to VirusTotal
  # (0052). Only a release that is due is checked: a pull request's build is not
  # the file that ships, and the verdicts of near-identical builds can differ. A
  # flag by any engine fails this job and so blocks the release, unless the run
  # was started by hand with the override ticked. A file VirusTotal already has
  # is not sent again, so "Re-run failed jobs" after an outage or an analysis
  # that was slow looks at the same artifact and reads the same report. The
  # report is also written as the notes' table and the badge's JSON, uploaded
  # as the artifact "virustotal" for the release job (0053).
  virustotal:
    needs: [version, build]
    if: needs.version.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86_64-pc-windows-msvc
          path: dist
      # No sha256sum -c here: collin writes SHA256SUMS in the release job, so
      # no per-file .sha256 exists before it to check the download against.
      # The free key allows 4 requests a minute: every call waits 15 s first, and
      # a 429 waits a minute and asks again. The key is only ever in the header
      # file curl reads, and nothing here prints it.
      - name: Scan it on VirusTotal
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          # Empty on a push, which counts as false.
          FORCE: ${{ inputs.publish_even_if_flagged }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VT_KEY" ]; then
            echo "::error::The VIRUSTOTAL_API_KEY repository secret is not set, so no release can be checked or published. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          api=https://www.virustotal.com/api/v3
          work=$RUNNER_TEMP/vt
          mkdir -p "$work"
          body=$work/body.json
          (umask 077; printf 'x-apikey: %s\n' "$VT_KEY" > "$work/header")

          # vt METHOD PATH [curl args]: prints the HTTP code, the body is in $body.
          vt() {
            local method=$1 path=$2 try code
            shift 2
            for try in 1 2 3 4 5; do
              sleep 15
              rm -f "$body"
              code=$(curl -sS --proto =https -X "$method" -H "@$work/header" \
                -o "$body" -w '%{http_code}' "$@" "$api$path") || code=000
              if [ "$code" != 429 ]; then
                echo "$code"
                return 0
              fi
              [ "$try" -lt 5 ] && sleep 60
            done
            echo 429
          }
          # unexpected WHAT CODE: the status and VirusTotal's own error code.
          unexpected() {
            local why
            why=$(jq -r '.error.code // empty | gsub("[^A-Za-z0-9]"; "")' "$body" 2>/dev/null || true)
            echo "::error::VirusTotal answered $2 to $1 (${why:-no error code})."
            exit 1
          }
          # has_results FILE: whether a report holds the engines' verdicts.
          has_results() {
            [ "$(jq '(.data.attributes.last_analysis_results // {}) | length' "$1")" -gt 0 ]
          }

          files=("collin-v$VERSION-x86_64-pc-windows-msvc.zip")
          shas=()
          ids=()
          for i in "${!files[@]}"; do
            file=${files[$i]}
            sha=$(sha256sum "dist/$file" | cut -d' ' -f1)
            shas[$i]=$sha
            ids[$i]=
            rm -f "$work/$i.json"
            code=$(vt GET "/files/$sha")
            case "$code" in
              200) cp "$body" "$work/$i.json" ;;
              404) ;;
              *) unexpected "the lookup of $file" "$code" ;;
            esac
            if [ ! -f "$work/$i.json" ]; then
              code=$(vt POST /files -F "file=@dist/$file")
              [ "$code" = 200 ] || unexpected "the upload of $file" "$code"
              ids[$i]=$(jq -r '.data.id' "$body")
              echo "$file sent"
            elif has_results "$work/$i.json"; then
              echo "$file is already known"
            else
              echo "$file is known, its analysis is not finished"
            fi
          done

          deadline=$((SECONDS + 1800))
          for i in "${!files[@]}"; do
            file=${files[$i]}
            sha=${shas[$i]}
            while ! { [ -f "$work/$i.json" ] && has_results "$work/$i.json"; }; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::The analysis of $file did not finish; re-run the failed jobs."
                exit 1
              fi
              if [ -n "${ids[$i]}" ]; then
                # Sent by this run: the analysis says when the report is whole.
                code=$(vt GET "/analyses/${ids[$i]}")
                [ "$code" = 200 ] || unexpected "the analysis of $file" "$code"
                if [ "$(jq -r '.data.attributes.status' "$body")" = completed ]; then
                  code=$(vt GET "/files/$sha")
                  [ "$code" = 200 ] || unexpected "the report of $file" "$code"
                  cp "$body" "$work/$i.json"
                  if has_results "$work/$i.json"; then
                    break
                  fi
                  # Completed but still empty: ask the file's report, as for one
                  # sent by an earlier run, until the deadline.
                  ids[$i]=
                fi
              else
                # Sent by an earlier run: the file's own report fills in.
                code=$(vt GET "/files/$sha")
                [ "$code" = 200 ] || unexpected "the report of $file" "$code"
                cp "$body" "$work/$i.json"
              fi
              sleep 60
            done
          done

          # Flagged is malicious plus suspicious. Engine names and verdicts come
          # from VirusTotal, so only plain characters are kept of them before they
          # reach a log command or the summary.
          defs='def clean: gsub("[^A-Za-z0-9 ._:/!()+,-]"; "");
                def hit: select(.category == "malicious" or .category == "suspicious");'
          flagged_any=false
          blocked=
          # What the release job publishes: the table for the notes and the
          # file shields.io reads for the README badge (0053). Both are written
          # before a flag can end this step, so a run that publishes anyway
          # carries them too.
          out=$RUNNER_TEMP/vt-out
          mkdir -p "$out"
          worst_flagged=-1
          worst_engines=0
          table=$work/table.md
          {
            echo "| File | SHA-256 | Flagged / engines | Report |"
            echo "| --- | --- | --- | --- |"
          } > "$table"
          : > "$work/details.md"
          for i in "${!files[@]}"; do
            file=${files[$i]}
            sha=${shas[$i]}
            report=$work/$i.json
            flagged=$(jq '(.data.attributes.last_analysis_stats.malicious // 0) + (.data.attributes.last_analysis_stats.suspicious // 0)' "$report")
            engines=$(jq '.data.attributes.last_analysis_results | length' "$report")
            echo "| \`$file\` | \`$sha\` | $flagged / $engines | [report](https://www.virustotal.com/gui/file/$sha) |" >> "$table"
            # The badge shows the file with the most flags.
            if [ "$flagged" -gt "$worst_flagged" ]; then
              worst_flagged=$flagged
              worst_engines=$engines
            fi
            echo "$file: $flagged of $engines engines flag it"
            if [ "$flagged" -gt 0 ]; then
              flagged_any=true
              jq -r --arg f "$file" "$defs"'
                .data.attributes.last_analysis_results[] | hit
                | "- `\($f)`: \(.engine_name | clean): `\((.result // .category) | clean)`"' \
                "$report" >> "$work/details.md"
              names=$(jq -r "$defs"'
                [.data.attributes.last_analysis_results[] | hit | .engine_name | clean]
                | unique | join(", ")' "$report")
              blocked="${blocked:+$blocked; }$file ($names)"
            fi
          done
          {
            echo "### VirusTotal"
            echo
            cat "$table"
            if [ -s "$work/details.md" ]; then
              echo
              cat "$work/details.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### VirusTotal"
            echo
            echo "The Windows archive was checked on VirusTotal before this release was published."
            echo
            cat "$table"
            if [ -s "$work/details.md" ]; then
              echo
              cat "$work/details.md"
            fi
          } > "$out/virustotal.md"
          case "$worst_flagged" in
            0) color=brightgreen ;;
            1) color=yellow ;;
            2) color=orange ;;
            *) color=red ;;
          esac
          jq -n --arg message "$worst_flagged/$worst_engines · v$VERSION" --arg color "$color" \
            '{schemaVersion: 1, label: "VirusTotal", message: $message, color: $color}' \
            > "$out/virustotal.json"

          if [ "$flagged_any" = true ]; then
            if [ "$FORCE" = true ]; then
              echo "::warning::VirusTotal flagged $blocked. Published anyway, as the run asked."
              exit 0
            fi
            echo "::error::The release was not published: VirusTotal flagged $blocked. To publish anyway, run the release workflow by hand on main with \"Publish even if a VirusTotal engine flags the file\" ticked; it builds again and checks the new file."
            exit 1
          fi
      # Default if: success(): a blocked run uploads nothing, a forced one does.
      # The names cannot match what the release job attests or sums (collin-*).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal
          path: ${{ runner.temp }}/vt-out/
          if-no-files-found: error
          retention-days: 7

  # Only this job can write, and only on main with a version still untagged.
  release:
    needs: [version, build, virustotal]
    if: needs.version.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestation is signed with this workflow's identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/collin-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum collin-* > SHA256SUMS
          # The tag is created with the release, at the commit that was built.
          # The notes are the VirusTotal table, then GitHub's list of what was
          # merged since the last release, not the message of whichever commit
          # started this run: a retry or a fix to this file would otherwise
          # describe itself. virustotal.json is not attested: no one runs it,
          # and the README badge reads it from the latest release (0053).
          gh release create "$TAG" collin-* SHA256SUMS virustotal.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "collin $TAG" --notes-file virustotal.md --generate-notes
